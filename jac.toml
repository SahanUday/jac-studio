[project]
name = "jac-studio"
version = "0.1.0"
description = "VS Code's workbench reimplemented in Jac, real Monaco as the editor engine -- see docs/architecture.md and docs/roadmap.md"
entry-point = "main.jac"
kind = "web-app"
jac-version = "==0.36.1"

[jac-shadcn]
style = "nova"
baseColor = "zinc"
theme = "sky"
font = "figtree"
radius = "small"
menuAccent = "subtle"
menuColor = "default"
[dependencies]
debugpy = ">=1.8.0"
claude-agent-sdk = ">=0.1.0"
watchdog = ">=4.0.0"
[dependencies.npm]
sonner = "^2.0.7"
cmdk = "^1.1.1"
react-resizable-panels = "^2.1.9"
"@fontsource-variable/figtree" = "*"
radix-ui = "^1.6.7"
"@vscode/codicons" = "^0.0.46-24"
"@radix-ui/react-slot" = "^1.3.3"
class-variance-authority = "^0.7.1"
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"
"@tailwindcss/vite" = "^4.1.17"
tailwindcss = "^4.1.17"
"@monaco-editor/react" = "^4.7.0"
"@xterm/xterm" = "^5.5.0"
"@xterm/addon-fit" = "^0.10.0"
react-markdown = "^9.0.1"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "4.7.0"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[serve]
base_route_app = "app"

[client]
[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[test]
directory = "src"

# The placement solver mis-places two module shapes, each needing an explicit pin:
#   - uses root/jid() but has no Python import or graph archetype to anchor it server-side, so it
#     gets pulled wholesale into the client bundle -> 2026-08-31-anchor-free-root-using-module-pulled-client-wholesale
#   - is client-only but imports one server def:pub, which it reads as reason to place the whole
#     module server-side -> 2026-08-31-client-module-with-one-server-import-pulled-server-wholesale
# The jac_*_provider pins are all the second case: client-only Monaco code importing one lsp_client
# function. breadcrumb_symbols is pinned as insurance -- a wrong default would silently reintroduce
# the per-keystroke RPC round trip it exists to avoid.
[placement.pins]
"src.workbench.output.output_service" = "server"
"src.editor.client.jac_completion_provider" = "client"
"src.editor.client.jac_hover_provider" = "client"
"src.editor.client.jac_definition_provider" = "client"
"src.editor.client.jac_reference_provider" = "client"
"src.editor.client.jac_rename_provider" = "client"
"src.editor.client.breadcrumb_symbols" = "client"

# Deny-by-default: the terminal refuses to run anything until this is flipped on. Granting it is
# the same trust level as the user opening their own shell.
[terminal]
enabled = false
