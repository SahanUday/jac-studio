[project]
name = "jac-studio"
version = "0.1.0"
description = "VS Code's workbench reimplemented in Jac, real Monaco as the editor engine -- see docs/architecture.md and docs/roadmap.md"
entry-point = "main.jac"
kind = "web-app"
jac-version = "==0.36.1"

[jac-shadcn]
style = "nova"
baseColor = "zinc"
theme = "sky"
font = "figtree"
radius = "small"
menuAccent = "subtle"
menuColor = "default"
[dependencies]
[dependencies.npm]
cmdk = "^1.1.1"
react-resizable-panels = "^2.1.9"
"@fontsource-variable/figtree" = "*"
radix-ui = "^1.6.7"
"@vscode/codicons" = "^0.0.46-24"
"@radix-ui/react-slot" = "^1.3.3"
class-variance-authority = "^0.7.1"
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"
"@tailwindcss/vite" = "^4.1.17"
tailwindcss = "^4.1.17"
"@monaco-editor/react" = "^4.7.0"
"@xterm/xterm" = "^5.5.0"
"@xterm/addon-fit" = "^0.10.0"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "4.7.0"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[serve]
base_route_app = "app"

[client]
[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[test]
directory = "src"

# output_service.jac uses `root`/`jid()` (server-only concepts) but has no Python import or graph
# archetype to anchor it server per the placement solver's own evidence rules -- without this pin
# the whole module, jid(root) included, gets pulled wholesale into the client bundle the moment a
# client component (src/workbench/output/output.jac) imports one of its def:pub functions, and
# jid() then throws a confusing runtime error instead of dispatching over RPC. See tracker entry
# 2026-08-31-anchor-free-root-using-module-pulled-client-wholesale.
[placement.pins]
"src.workbench.output.output_service" = "server"

# Deny-by-default: the integrated terminal (src/workbench/terminal/terminal_service.jac) refuses to
# run any command until this is explicitly flipped on, same posture docs/architecture.md scopes for
# the desktop `shell` capability -- "same trust level as [the user] opening their own terminal."
[terminal]
enabled = false
